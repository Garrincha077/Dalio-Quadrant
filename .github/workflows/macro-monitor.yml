name: Macro monitor
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [data/history.json]
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macro-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm test
      - name: Install numerical research dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/research/requirements.txt
      - name: Verify research causality, returns and costs with synthetic data
        run: python scripts/research/test_backtest.py
      - name: Verify static state forward-return research
        run: python scripts/research/test_state_forward.py
      - name: Verify extended state research timing, execution and source guards
        run: python scripts/research/test_extended_state.py
  archive:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Fetch and archive changed macro observations
        run: node scripts/archive.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Persist changed observations
        run: |
          git add data/history.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: archive changed FRED macro observations'
          git push origin HEAD:main
